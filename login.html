<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>

    <form>
        <h2>Login</h2>

        <input
            type="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

</body>
</html>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

form {
    background: #ffffff;
    width: 100%;
    max-width: 380px;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

h2 {
    text-align: center;
    font-size: 30px;
    color: #1e1b4b;
    margin-bottom: 10px;
}

form::before {
    content: "Welcome Back!";
    display: block;
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

input {
    display: block;
    width: 100%;
    padding: 15px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4f46e5, #9333ea);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
}

button:active {
    transform: scale(0.98);
}
</style>
